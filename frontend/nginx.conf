server {
  listen 80;

  # Docker's embedded DNS — lets us defer upstream resolution to request time
  # so nginx doesn't fail at startup if the backend container isn't ready yet.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Cinna CLI endpoints — must come before /api/ because they carry
  # a long-lived WebSocket tunnel (`/api/v1/cli/agents/<id>/sync-stream`,
  # Mutagen over WS) and an SSE stream (`/api/v1/cli/agents/<id>/exec`).
  # See docs/infrastructure/nginx_setup.md for the full location-block map.
  location /api/v1/cli/ {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Agent Environment Console — web terminal + live logs follow. Must come
  # before /api/ because these are WebSocket-only routes
  # (`/api/v1/env-console/<id>/terminal`, `/api/v1/env-console/<id>/logs/stream`):
  # the plain /api/ block lacks the upgrade headers, so the handshake would
  # reach the backend as a plain GET and Starlette would 404 the WS-only path.
  # See docs/infrastructure/nginx_setup.md.
  location /api/v1/env-console/ {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Well-known discovery endpoints (must reach backend, not the SPA) ──
  # These URIs live at the origin root by spec (RFC 8615 / RFC 9728 / RFC 8414),
  # so they must be proxied explicitly. The production reverse proxy does the
  # same; these rules keep local docker-compose in parity when the frontend
  # container is the entry point on http://localhost/.

  location /.well-known/cinna-desktop {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /.well-known/cinna-app {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /.well-known/oauth-protected-resource {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /.well-known/oauth-authorization-server {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Local Agent Kit public entrypoint ────────────────────────────────
  # /agent-start is the pasteable URL a user hands to a coding assistant. It sits at
  # the origin root next to the SPA, so without this block the SPA shell would
  # answer it. The /api/agent-start alias (covered by the /api/ block above) is the
  # fallback when a proxy cannot be changed.
  # See docs/infrastructure/nginx_setup.md.
  #
  # Regex, not the `location /agent-start` prefix form: a prefix match is on the
  # string, so it would also capture a future SPA route named /startup or
  # /starter-kit and proxy it to a backend that 404s. This matches /agent-start,
  # /agent-start/ and /agent-start/<path> and nothing else.

  location ~ ^/agent-start(/|$) {
    set $upstream http://backend:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
