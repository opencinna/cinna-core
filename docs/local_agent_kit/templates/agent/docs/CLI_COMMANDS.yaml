# Named shell commands this agent exposes.
#
# Locally: documentation of what can be run, mirrored by the Makefile.
# In the cloud: each entry becomes a /run:<name> slash command, an A2A skill and a
# webapp action, executed without spending an LLM turn.
#
# Rules:
#   name         required; ^[a-z][a-z0-9_-]{0,31}$; unique in this file
#   command      required; single line, <= 1024 chars; cwd is the workspace root
#   description  optional; <= 512 chars
#
# Commands are CLOUD-FIRST: write `python scripts/x.py` with paths relative to the
# workspace root. Do not use `uv run` here and do not use absolute paths — the
# Makefile is where the local `uv run` mirror lives.

commands:
  - name: status
    description: Refresh the agent's self-reported STATUS.md.
    command: python scripts/update_status.py --status ok --summary "Ready"
